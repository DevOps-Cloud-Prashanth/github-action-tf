name: Terraform staged deploy with approvals

on:
  workflow_dispatch:
    inputs:
      run_destroy:
        description: "Enable destroy stage (true/false)"
        required: true
        type: choice
        options:
          - "false"
          - "true"

jobs:

  approve-validate:
    runs-on: ubuntu-latest
    environment: validate-approval   # ⛔ WAIT FOR APPROVAL
    steps:
      - run: echo "Approved to start validation stage"


  validate:
    needs: approve-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate


  approve-plan:
    needs: validate
    runs-on: ubuntu-latest
    environment: plan-approval    # ⛔ WAIT FOR APPROVAL
    steps:
      - run: echo "Approved to start plan stage"


  plan:
    needs: approve-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        run: terraform plan -out=tfplan
      - name: Save Human Readable Plan
        run: terraform show -no-color tfplan > plan.txt
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifacts
          path: |
            tfplan
            plan.txt


  approve-apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: apply-approval    # ⛔ WAIT FOR APPROVAL
    steps:
      - run: echo "Approved to start apply stage"


  apply:
    needs: approve-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-artifacts
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  approve-destroy:
    if: ${{ github.event.inputs.run_destroy == 'true' }}
    needs: apply
    runs-on: ubuntu-latest
    environment: destroy-approval    # ⛔ WAIT FOR APPROVAL
    steps:
      - run: echo "Approved to start destroy stage"


  destroy:
    if: ${{ github.event.inputs.run_destroy == 'true' }}
    needs: approve-destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Terraform Init
        run: terraform init
      - name: Terraform Destroy
        run: terraform destroy -auto-approve
